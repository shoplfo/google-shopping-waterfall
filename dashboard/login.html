<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Shopping Waterfall Engine</title>
  <style>
    :root {
      --navy: #264653;
      --coral: #E76F51;
      --bg: #FAF8F4;
      --card-bg: #FFFFFF;
      --gray-200: #E5E2DC;
      --gray-500: #9A9A9A;
      --gray-700: #575760;
      --gray-900: #2C2C2C;
      --radius: 16px;
      --shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--gray-900); display: flex; align-items: center; justify-content: center; min-height: 100vh; }

    .login-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
    }
    .login-card .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-card .logo .logo-main { font-size: 22px; font-weight: 600; letter-spacing: -0.3px; }
    .login-card h2 {
      text-align: center;
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 28px;
      color: var(--gray-900);
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--gray-900);
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--gray-200);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      background: #F5F2EC;
      transition: border-color 0.2s, background 0.2s;
    }
    .form-group input:focus {
      border-color: var(--coral);
      background: #fff;
    }
    .login-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: var(--coral);
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.15s;
    }
    .login-btn:hover { opacity: 0.85; }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .error-msg {
      color: var(--coral);
      font-size: 13px;
      text-align: center;
      margin-top: 12px;
      min-height: 20px;
    }
    .forgot-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      color: var(--gray-500);
      text-decoration: none;
    }
    .forgot-link:hover { color: var(--coral); }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <div class="logo-main">Shopping Waterfall</div>
    </div>
    <h2>Sign In</h2>
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" autofocus />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
      <div class="error-msg" id="errorMsg"></div>
    </form>
    <a href="/reset-password.html" class="forgot-link">Forgot password?</a>
  </div>

  <script>
    // If already logged in, redirect to dashboard
    fetch('/api/auth/me').then(r => { if (r.ok) window.location.href = '/'; });

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errEl = document.getElementById('errorMsg');
      errEl.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');
        window.location.href = '/';
      } catch (err) {
        errEl.textContent = err.message;
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }
  </script>
</body>
</html>
